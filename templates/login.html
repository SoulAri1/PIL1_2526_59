{% extends 'base.html' %}

{% block title %}Connexion - IFRI MentorLink{% endblock %}

{% block content %}

<div class="container mt-5">
    <h2>Connexion</h2>

    {% if erreur %}
        <div class="alert alert-danger">
            {{ erreur }}
        </div>
    {% endif %}

    <form action="/auth/login" method="POST">

        <div class="mb-3">
            <label>Email</label>
            <input type="email"
                   name="email"
                   class="form-control"
                   required>
        </div>

        <div class="mb-3">
            <label>Mot de passe</label>
            <input type="password"
                   name="mot_de_passe"
                   class="form-control"
                   required>
        </div>

        <button type="submit" class="btn btn-primary">
            Se connecter
        </button>

    </form>
</div>

{% endblock %}
